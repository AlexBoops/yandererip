<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Yandere Simulator</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d0d0d;
        color: #eee;
        font-family: monospace;
        z-index: 999;
      }
      .track {
        width: min(340px, 80vw);
        height: 8px;
        background: #222;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 14px;
      }
      .fill {
        width: 0%;
        height: 100%;
        background: #e91e63;
        transition: width 0.15s ease-out;
      }
      .custom-controls {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 10000;
      }
      .custom-btn {
        background: rgba(25, 25, 25, 0.85);
        color: #e0e0e0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.2s, color 0.2s;
      }
      .custom-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
    </style>

    <script>
      // Trap and suppress pointer lock rejections in sandboxed containers
      const origPointerLock = Element.prototype.requestPointerLock || function() {};
      Element.prototype.requestPointerLock = function() {
        try {
          const res = origPointerLock.apply(this, arguments);
          if (res && typeof res.catch === 'function') res.catch(() => {});
          return res;
        } catch (e) {}
      };
    </script>
  </head>
  <body>
    <div class="custom-controls">
      <button class="custom-btn" id="btn-ab">🌐 About:Blank</button>
      <button class="custom-btn" id="btn-fs">⛶ Fullscreen</button>
    </div>

    <div id="loading-overlay">
      <div id="status">Reading parts manifest...</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
      const statusEl = document.querySelector("#status");
      const fillEl = document.querySelector("#fill");
      const canvasEl = document.querySelector("#unity-canvas");
      const overlayEl = document.querySelector("#loading-overlay");
      const abBtn = document.querySelector("#btn-ab");
      const fsBtn = document.querySelector("#btn-fs");

      const isAboutBlank = window.location.href === "about:blank" || window.origin === "null";
      if (isAboutBlank && abBtn) {
        abBtn.remove();
      }

      // About:Blank Cloaker
      if (abBtn) {
        abBtn.addEventListener("click", function(e) {
          e.preventDefault();
          e.stopPropagation();
          try {
            const win = window.open("about:blank", "_blank");
            if (!win || win.closed) {
              alert("Pop-up blocked. Please allow pop-ups for this site.");
              return;
            }

            const clone = document.documentElement.cloneNode(true);
            const oldAb = clone.querySelector("#btn-ab");
            if (oldAb) oldAb.remove();

            win.document.open();
            win.document.write("<!DOCTYPE html>\n" + clone.outerHTML);
            win.document.close();

            win.document.title = "Google Docs";
            const link = win.document.createElement("link");
            link.rel = "icon";
            link.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";
            win.document.head.appendChild(link);
          } catch (err) {
            console.error("About:blank deployment error:", err);
          }
        });
      }

      // Fullscreen handler
      if (fsBtn) {
        fsBtn.addEventListener("click", function(e) {
          e.preventDefault();
          e.stopPropagation();
          const target = canvasEl || document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const req = target.requestFullscreen || target.webkitRequestFullscreen;
            if (req) req.call(target).catch(() => {});
          } else {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document).catch(() => {});
          }
        });
      }

      // Stream fetch each part and stitch into a single TypedArray Blob
      async function assembleTarget(targetEntry, startPct, endPct, label) {
        const parts = targetEntry.parts;
        const totalExpected = targetEntry.size;
        const buffer = new Uint8Array(totalExpected);
        let offset = 0;

        for (let i = 0; i < parts.length; i++) {
          const partName = parts[i];
          statusEl.textContent = `Downloading ${label} (${i + 1}/${parts.length})...`;
          const res = await fetch("Build/" + partName);
          if (!res.ok) throw new Error(`HTTP ${res.status} on Build/${partName}`);

          const reader = res.body.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer.set(value, offset);
            offset += value.byteLength;
          }

          const currentPct = startPct + Math.round(((i + 1) / parts.length) * (endPct - startPct));
          fillEl.style.width = `${currentPct}%`;
        }

        return URL.createObjectURL(new Blob([buffer], { type: targetEntry.type }));
      }

      (async () => {
        try {
          // 1. Read parts manifest
          const manifestRes = await fetch("Build/parts-manifest.json");
          if (!manifestRes.ok) throw new Error("Could not load Build/parts-manifest.json");
          const manifest = await manifestRes.json();

          const dataEntry = manifest.files.find(f => f.target === "dataUrl");
          const wasmEntry = manifest.files.find(f => f.target === "codeUrl");

          if (!dataEntry || !wasmEntry) {
            throw new Error("Manifest is missing dataUrl or codeUrl configuration.");
          }

          // 2. Download and assemble 43 Data parts (0% to 55%)
          const dataBlobUrl = await assembleTarget(dataEntry, 0, 55, "game data");

          // 3. Download and assemble 2 WASM parts (55% to 75%)
          const wasmBlobUrl = await assembleTarget(wasmEntry, 55, 75, "webassembly");

          statusEl.textContent = "Booting engine...";

          const config = {
            dataUrl: dataBlobUrl,
            frameworkUrl: "Build/YandereSim.framework.js",
            codeUrl: wasmBlobUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "YandereDev",
            productName: "YandereSimulator",
            productVersion: "1.0",
          };

          const loaderScript = document.createElement("script");
          loaderScript.src = "Build/YandereSim.loader.js";
          loaderScript.onload = () => {
            createUnityInstance(canvasEl, config, (progress) => {
              fillEl.style.width = `${75 + Math.round(25 * progress)}%`;
              statusEl.textContent = `Initializing game: ${Math.round(progress * 100)}%`;
            }).then(() => {
              overlayEl.remove();
            }).catch((err) => {
              statusEl.textContent = "Engine crashed on startup.";
              console.error(err);
            });
          };

          document.body.appendChild(loaderScript);
        } catch (err) {
          statusEl.textContent = "Failed downloading or merging build chunks.";
          console.error("Asset initialization failed:", err);
        }
      })();
    </script>
  </body>
</html>
